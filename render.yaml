services:
  # Deploy JARVIS Backend as a Free Docker Web Service
  - type: web
    name: jarvis-ai-brain
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: BROWSER_ENGINE
        value: chromium
      - key: DISPLAY
        value: ":0"
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: "true"
      - key: PUPPETEER_EXECUTABLE_PATH
        value: "/usr/bin/chromium"
